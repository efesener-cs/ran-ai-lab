name: Container acceptance
on:
  workflow_dispatch:
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        backend: [native, live]
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned dependencies and scenario
        run: docker build --target ${{ matrix.backend }} -t ran-ai-lab:${{ matrix.backend }} --build-arg BUILD_JOBS=2 .
      - name: Unit tests in image
        run: bash docker/lab.sh ${{ matrix.backend }} "${{ runner.temp }}/lab-output" -m unittest discover -p 'test_*.py'
      - name: Data, training, six attack modes and analysis
        run: bash docker/lab.sh ${{ matrix.backend }} "${{ runner.temp }}/lab-output" docker/smoke.py --backend ${{ matrix.backend }}
      - name: Preserve acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.backend }}-diagnostics
          path: ${{ runner.temp }}/lab-output
          if-no-files-found: ignore
