name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-ai.txt -r requirements-analysis.txt
      - run: python -m unittest discover -p 'test_*.py'
      - run: python scripts/check_publish.py
      - run: git diff --check
